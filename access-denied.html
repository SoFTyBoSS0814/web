<script>
      (function() {
        // A te letiltott IP-d és az indokod
        const bannedList = {
          '77.110.174.78': 'Ki lettél tiltva az alábbi indokkal: Teszt'
        };

        // Megpróbáljuk lekérni az IP-t, de ha hiba van, a saját teszt IP-nket vesszük alapul
        fetch('https://api.ipify.org?format=json')
          .then(response => response.json())
          .then(data => processBan(data.ip))
          .catch(err => {
            console.warn('API hiba, fallback IP használata:', err);
            processBan('77.110.174.78'); // Tesztcélra beállítva, ha az API blockolva van
          });

        function processBan(userIP) {
          const reason = bannedList[userIP] || 'Ismeretlen vagy adminisztratív tiltás';

          // Biztosítjuk, hogy a DOM elemek megvannak
          const updateUI = () => {
            const ipDisplay = document.getElementById('banned-ip-display');
            const reasonDisplay = document.getElementById('banned-reason-display');

            if (ipDisplay) {
              ipDisplay.innerText = "LETILTOTT IP: " + userIP;
            }
            if (reasonDisplay) {
              reasonDisplay.innerText = "INDOKLÁS: " + reason;
            }
          };

          if (document.readyState === 'loading') {
            document.addEventListener("DOMContentLoaded", updateUI);
          } else {
            updateUI();
          }
        }
      })();
    </script>
