<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hozzáférés megtagadva - M&M Házfelújítás</title>

    <!-- IP ELLENŐRZŐ ÉS EGYEDI INDOKLÁS SCRIPT (Átirányítás nélkül) -->
    <script>
      (function() {
        // 1. IDE ÍRD BE AZ IP-CÍMEKET ÉS A HOZZÁJUK TARTOZÓ EGYEDI INDOKOKAT:
        const bannedList = {
          '77.110.174.78': 'Ki lettél tiltva az alábbi indokkal: Teszt'
        };

        // 2. Lekérjük a látogató IP-címét
        fetch('https://api.ipify.org?format=json')
          .then(response => response.json())
          .then(data => {
            const userIP = data.ip;
            const reason = bannedList[userIP] || 'Ismeretlen vagy adminisztratív tiltás';

            // Megjelenítjük a címet és az indokot a DOM betöltődése után
            document.addEventListener("DOMContentLoaded", function() {
              const ipDisplay = document.getElementById('banned-ip-display');
              const reasonDisplay = document.getElementById('banned-reason-display');

              if (ipDisplay) {
                ipDisplay.innerText = "LETILTOTT IP: " + userIP;
              }
              if (reasonDisplay) {
                reasonDisplay.innerText = "INDOKLÁS: " + reason;
              }
            });
          })
          .catch(err => console.error('IP ellenőrzési hiba:', err));
      })();
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1e24;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .banned-card {
            background-color: #252a32;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            max-width: 520px;
            width: 100%;
            border-top: 5px solid #ff4d4d;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #ff4d4d;
        }
        p {
            font-size: 15px;
            color: #a0a6b1;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .info-box {
            background-color: #1e2228;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #ff6b6b;
            font-family: monospace;
            border: 1px solid #3a2222;
            margin-bottom: 10px;
        }
        .ip-box {
            font-size: 12px;
            color: #717782;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="banned-card">
        <div class="icon">🚫</div>
        <h1>Hozzáférés letiltva</h1>
        <p>Az oldal adminisztrátora korlátozta a hozzáférést erről a hálózatról fiktív, komolytalan ajánlatkérés vagy visszaélésszerű használat miatt.</p>
        
        <div class="info-box" id="banned-reason-display">
            INDOKLÁS: Ellenőrzés...
        </div>
        
        <div class="ip-box" id="banned-ip-display">
            LETILTOTT IP: Ellenőrzés...
        </div>
    </div>

</body>
</html>
