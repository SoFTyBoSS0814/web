<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Látogatók – M&amp;M Házfelújítás</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #1e293b; margin: 0; padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 24px; }
    .tabs { display: flex; gap: 10px; }
    .tab { padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; background: #e2e8f0; color: #1e293b; }
    .tab.active { background: #0f766e; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 18px; text-align: center; }
    .card .label { font-size: 13px; color: #64748b; margin-bottom: 8px; }
    .card .value { font-size: 28px; font-weight: 700; color: #0f172a; }
    .status { margin-top: 16px; font-size: 13px; color: #0f766e; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <h2>M&amp;M Házfelújítás – HU Statisztika</h2>
      <nav class="tabs">
        <a href="index.html" class="tab">Főoldal</a>
        <a href="latogatok.html" class="tab active">Látogatók</a>
      </nav>
    </div>

    <div class="grid">
      <div class="card"><div class="label">Ma</div><div class="value" id="stat-ma">-</div></div>
      <div class="card"><div class="label">Tegnap</div><div class="value" id="stat-tegnap">-</div></div>
      <div class="card"><div class="label">Elmúlt 7 nap</div><div class="value" id="stat-het">-</div></div>
      <div class="card"><div class="label">Elmúlt 30 nap</div><div class="value" id="stat-honap">-</div></div>
      <div class="card"><div class="label">Összesen</div><div class="value" id="stat-osszesen">-</div></div>
    </div>

    <div class="status" id="live-status">Élő frissítés aktív (csak HU látogatók)...</div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://emoypvnhhqmdjmxawkpg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtb3lwdm5oaHFtZGpteGF3a3BnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMzg0MTQsImV4cCI6MjEwNDYxNDQxNH0.J7BfwG-feB6cQK2hBOfA2mKIivfnOO-rBxFwAx9HcSU';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function frissitStatisztikat() {
      const { data, error } = await supabase.rpc('get_hu_latogatok_stat');
      if (error) {
        document.getElementById('live-status').textContent = 'Hiba a lekérdezésnél: ' + error.message;
        return;
      }
      document.getElementById('stat-ma').textContent = data.ma ?? 0;
      document.getElementById('stat-tegnap').textContent = data.tegnap ?? 0;
      document.getElementById('stat-het').textContent = data.het ?? 0;
      document.getElementById('stat-honap').textContent = data.honap ?? 0;
      document.getElementById('stat-osszesen').textContent = data.osszesen ?? 0;
      document.getElementById('live-status').textContent =
        'Élő frissítés aktív • Utoljára frissítve: ' + new Date().toLocaleTimeString('hu-HU');
    }

    frissitStatisztikat();

    supabase
      .channel('hu-latogatok-live')
      .on(
        'postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'hu_latogatok' },
        () => {
          frissitStatisztikat();
        }
      )
      .subscribe();

    setInterval(frissitStatisztikat, 10000);
  </script>
</body>
</html>
